name: CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'unplugin-granularity-v*'
      - 'granularity-test-kit-v*'
      - 'granularity-chrono-v*'
      - 'granularity-charts-v*'
      - 'granularity-dashboard-v*'
      - 'granularity-forms-schema-v*'
      - 'granularity-datasource-v*'
      - 'granularity-editor-v*'
  pull_request:
    branches: [ main ]
  # Ручной перезапуск: push тега тем же значением события не создаёт, и упавший
  # релиз иначе перезапускается только пересозданием тега.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Гейты токенов, реестров и дефолтов живут фабриками в
  # @feugene/granularity-test-kit — ядро и все спутники зовут их из собранного
  # `dist`, поэтому пакет проверяется первым и ни от чего не зависит сам.
  build-granularity-test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint package
        run: yarn lint:test-kit

      - name: Typecheck package
        if: always()
        run: yarn typecheck:test-kit

      - name: Test package
        run: yarn test:test-kit

      - name: Build package
        run: yarn build:test-kit

      - name: Validate package metadata (publint)
        working-directory: packages/granularity-test-kit
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: granularity-test-kit-dist
          path: packages/granularity-test-kit/dist/

  # Публикация @feugene/granularity-test-kit в npm по тегу вида
  # `granularity-test-kit-v<semver>`. Отдельный тег нужен по той же причине, что
  # у остальных спутников: гейты правятся чаще ядра и не ждут его релиза.
  publish-npm-granularity-test-kit:
    needs:
      - build-granularity-test-kit
    if: startsWith(github.ref, 'refs/tags/granularity-test-kit-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/granularity-test-kit
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#granularity-test-kit-v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-test-kit-dist
          path: packages/granularity-test-kit/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/granularity-test-kit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория.
  publish-gpr-granularity-test-kit:
    needs:
      - build-granularity-test-kit
    if: startsWith(github.ref, 'refs/tags/granularity-test-kit-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-test-kit-dist
          path: packages/granularity-test-kit/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/granularity-test-kit
        run: |
          npm pkg set name='@efureev/granularity-test-kit'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/granularity-test-kit
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-granularity-datasource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Пакет линтуется с проверкой типов, а гейты импортируют
      # `@feugene/granularity-test-kit/gates`. Без его `dist` типы приезжают как
      # `any`, и `ts/no-unsafe-call` роняет шаг Lint.
      - name: Build test kit
        run: yarn build:test-kit

      - name: Lint package
        run: yarn lint:datasource

      - name: Typecheck package
        if: always()
        run: yarn typecheck:datasource

      - name: Test package
        run: yarn test:datasource

      - name: Build package
        run: yarn build:datasource

      - name: Validate package metadata (publint)
        working-directory: packages/granularity-datasource
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist/

  # Публикация @feugene/granularity-datasource в npm по тегу вида
  # `granularity-datasource-v<semver>`. Джобы `granular doctor` у пакета нет:
  # доктор проверяет раскладку компонентов, а компонентов здесь не бывает.
  publish-npm-granularity-datasource:
    needs:
      - build-granularity-datasource
    if: startsWith(github.ref, 'refs/tags/granularity-datasource-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/granularity-datasource
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#granularity-datasource-v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/granularity-datasource
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория.
  publish-gpr-granularity-datasource:
    needs:
      - build-granularity-datasource
    if: startsWith(github.ref, 'refs/tags/granularity-datasource-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/granularity-datasource
        run: |
          npm pkg set name='@efureev/granularity-datasource'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/granularity-datasource
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-granularity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint package
        run: yarn lint:granularity

      # `vue-tsc` эмитит `.d.ts` на сборке — красный typecheck ломает публикацию типов.
      - name: Typecheck package
        if: always()
        run: yarn typecheck:granularity

      # Дрейф реестров ломает не сборку, а tree-shaking, subpath-импорт и скан
      # классов — молча. У компаньонов проверка стояла с самого начала, у ядра
      # её не было, хотя генератор и гейт у него те же.
      - name: Registry drift
        if: always()
        working-directory: packages/granularity
        run: yarn generate:registry --check

      # Локали ядра: ключ, добавленный в одну, но не в три, даёт fallback на
      # английский у части интерфейса.
      - name: Locale completeness
        if: always()
        working-directory: packages/granularity
        run: yarn check:messages

      # Карта выбора компонента: генерируемый блок совпадает со страницами,
      # каждый компонент стоит хотя бы в одной развилке, ссылки резолвятся.
      - name: Check component map
        if: always()
        run: yarn docs:check

  # Витрина — самый большой код репозитория, который до сих пор не проверял
  # никто: скрипт `lint` у неё был, джобы не было, а `typecheck` не существовало
  # вовсе (не было ни скрипта, ни `vue-tsc`). Первый прогон нашёл 106 ошибок.
  #
  # Зависит от сборок пакетов: витрина типизируется против собранного `dist`,
  # как и её тесты.
  build-granularity-editor:
    needs:
      - quality-granularity
      - build-granularity
      - build-unplugin-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      # Пакет линтуется с проверкой типов, а гейты импортируют тест-кит: без его
      # `dist` типы приезжают как `any`, и `ts/no-unsafe-call` роняет шаг Lint.
      - name: Build test kit
        run: yarn build:test-kit

      - name: Lint package
        run: yarn lint:editor

      - name: Typecheck package
        if: always()
        run: yarn typecheck:editor

      # Реестры сверяются с файловой системой до сборки: рассинхрон ломает не
      # сборку, а tree-shaking, subpath-импорт и скан классов — молча.
      - name: Registry drift
        working-directory: packages/granularity-editor
        run: yarn generate:registry --check

      - name: Locale completeness
        working-directory: packages/granularity-editor
        run: yarn check:messages

      - name: Test package
        run: yarn test:editor

      - name: Build package
        run: yarn build:editor

      - name: Granular doctor
        working-directory: packages/granularity-editor
        run: yarn doctor

      - name: Validate package metadata (publint)
        working-directory: packages/granularity-editor
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist/

  # Публикация @feugene/granularity-editor в npm по тегу
  # `granularity-editor-v<semver>`.
  publish-npm-granularity-editor:
    needs:
      - build-granularity-editor
    if: startsWith(github.ref, 'refs/tags/granularity-editor-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/granularity-editor
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#granularity-editor-v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/granularity-editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория.
  publish-gpr-granularity-editor:
    needs:
      - build-granularity-editor
    if: startsWith(github.ref, 'refs/tags/granularity-editor-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/granularity-editor
        run: |
          npm pkg set name='@efureev/granularity-editor'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/granularity-editor
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-showcase:
    needs:
      - build-granularity
      - build-unplugin-granularity
      - build-granularity-chrono
      - build-granularity-charts
      - build-granularity-dashboard
      - build-granularity-forms-schema
      - build-granularity-datasource
      - build-granularity-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Спеки `e2e/**` импортируют `@feugene/granularity-test-kit/e2e`, а
      # `tsconfig.json` витрины их типизирует. Без собранного `dist` тест-кита
      # обе джобы витрины краснеют ещё до первой настоящей проверки.
      - name: Build test kit
        run: yarn build:test-kit

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      - name: Download granularity-chrono dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Download granularity-charts dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-charts-dist
          path: packages/granularity-charts/dist

      - name: Download granularity-dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dashboard-dist
          path: packages/granularity-dashboard/dist

      - name: Download granularity-forms-schema dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-forms-schema-dist
          path: packages/granularity-forms-schema/dist

      - name: Download granularity-datasource dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist

      - name: Download granularity-editor dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Lint showcase
        run: yarn lint:showcase

      - name: Typecheck showcase
        if: always()
        run: yarn typecheck:showcase

  docs-granularity:
    needs:
      - build-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Проверка читает `dist/web-types.json`, поэтому идёт после сборки, а не
      # в vitest: примеры на страницах сверяются с публичной поверхностью.
      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Check doc examples against API
        run: yarn docs:audit:check

  test-granularity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test package
        run: yarn test:granularity

  coverage-granularity:
    needs:
      - test-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Порог держит vitest (`coverage.thresholds` в `vitest.config.ts`), а не
      # шаг workflow: падение приходит отсюда с именами недобравших файлов.
      - name: Run coverage
        run: yarn coverage:granularity

      - name: Publish coverage summary
        if: always()
        run: |
          SUMMARY=packages/granularity/coverage/coverage-summary.json
          if [ -f "$SUMMARY" ]; then
            node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).total;const rows=["lines","statements","functions","branches"].map(k=>`| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`).join("\n");process.stdout.write("| Metric | Coverage |\n|---|---|\n"+rows+"\n");' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'coverage-summary.json not found' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: granularity-coverage
          path: packages/granularity/coverage/
          if-no-files-found: warn

  build-granularity:
    needs:
      - quality-granularity
      - test-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build package
        run: yarn build:granularity

      # Сверяет `config.dependencies` с импортами, реально присутствующими в
      # `dist`. Юнит-гейт `componentDependencies.test.ts` делает то же от
      # исходников, но не видит рёбер, возникших из-за чанкинга бандлера.
      # `--strict` роняет шаг и на warn-диагностиках (конфликты токенов, темы).
      - name: Granular doctor
        working-directory: packages/granularity
        run: yarn doctor

      - name: Validate package metadata (publint)
        working-directory: packages/granularity
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: granularity-dist
          path: packages/granularity/dist/

  # SSR-стенд: серверный рендер + гидрация настоящего серверного HTML.
  # Ловит то, что юнит-тесты в jsdom увидеть не могут: браузерный API в setup,
  # окружение в первом рендере, нестабильные id. Работает по собранному `dist`.
  # Стенд рендерит и ядро, и companion-пакет: у обоих в setup есть браузерный
  # API, телепорты и живые регионы, а расхождения видны только на гидрации.
  test-playground-ssr:
    # Стенд рендерит страницы обоих компаньонов, поэтому ему нужен и их dist.
    needs:
      - build-granularity
      - build-granularity-chrono
      - build-granularity-charts
      - build-granularity-dashboard
      - build-granularity-editor
      - build-granularity-forms-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download granularity-chrono dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Download granularity-charts dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-charts-dist
          path: packages/granularity-charts/dist

      - name: Download granularity-dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dashboard-dist
          path: packages/granularity-dashboard/dist

      - name: Download granularity-editor dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Download granularity-forms-schema dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-forms-schema-dist
          path: packages/granularity-forms-schema/dist

      - name: Test SSR playground
        run: yarn test:playground-ssr

  test-showcase:
    # Витрина использует авто-импорт `unplugin-vue-components` через резолверы
    # из @feugene/unplugin-granularity, @feugene/granularity-chrono и
    # @feugene/granularity-charts, а `uno.config.ts` читает провайдеры тех же
    # пакетов — их dist нужен уже при загрузке vite/vitest-конфига, поэтому
    # скачиваем все четыре.
    needs:
      - build-granularity
      - build-unplugin-granularity
      - build-granularity-chrono
      - build-granularity-charts
      - build-granularity-dashboard
      - build-granularity-forms-schema
      - build-granularity-datasource
      - build-granularity-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      - name: Download granularity-chrono dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Download granularity-charts dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-charts-dist
          path: packages/granularity-charts/dist

      - name: Download granularity-dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dashboard-dist
          path: packages/granularity-dashboard/dist

      - name: Download granularity-forms-schema dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-forms-schema-dist
          path: packages/granularity-forms-schema/dist

      - name: Download granularity-datasource dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist

      - name: Download granularity-editor dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Test showcase
        run: yarn test:showcase

  # Axe-гейт по всем 59 компонентам витрины. Baseline (`e2e/a11y-baseline.ts`) пуст,
  # поэтому падает любое новое serious/critical нарушение. Платформонезависим:
  # axe анализирует дерево доступности, а не рендер.
  test-a11y:
    needs:
      - build-granularity
      - build-unplugin-granularity
      - build-granularity-chrono
      - build-granularity-charts
      - build-granularity-dashboard
      - build-granularity-forms-schema
      - build-granularity-datasource
      - build-granularity-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Спеки `e2e/**` импортируют `@feugene/granularity-test-kit/e2e`, а
      # `tsconfig.json` витрины их типизирует. Без собранного `dist` тест-кита
      # обе джобы витрины краснеют ещё до первой настоящей проверки.
      - name: Build test kit
        run: yarn build:test-kit

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      - name: Download granularity-chrono dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Download granularity-charts dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-charts-dist
          path: packages/granularity-charts/dist

      - name: Download granularity-dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dashboard-dist
          path: packages/granularity-dashboard/dist

      - name: Download granularity-forms-schema dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-forms-schema-dist
          path: packages/granularity-forms-schema/dist

      - name: Download granularity-datasource dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist

      - name: Download granularity-editor dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Install Playwright browsers
        working-directory: apps/showcase
        run: npx playwright install --with-deps chromium

      - name: A11y gate
        run: yarn test:a11y

      # Оверлеи в открытом состоянии: axe по открытому окну, ловушка фокуса,
      # `inert` фона. Обычный a11y-гейт сканирует страницу как есть, то есть
      # окна на ней всегда закрыты.
      - name: Overlay gate
        run: yarn workspace @feugene/granularity-showcase test:overlay

      # То, чего в jsdom нет вовсе: `Tab`, активация кнопки по `Enter` и layout
      # (`ResizeObserver`). Юнит-тесты проверяют обработчик, но не путь до него.
      - name: Interaction gate
        run: yarn workspace @feugene/granularity-showcase test:interaction

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: apps/showcase/playwright-report/
          if-no-files-found: ignore

  build-showcase:
    needs:
      - test-showcase
      - build-granularity-chrono
      - build-granularity-charts
      - build-granularity-dashboard
      - build-granularity-forms-schema
      - build-granularity-datasource
      - build-granularity-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      - name: Download granularity-chrono dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Download granularity-charts dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-charts-dist
          path: packages/granularity-charts/dist

      - name: Download granularity-dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dashboard-dist
          path: packages/granularity-dashboard/dist

      - name: Download granularity-forms-schema dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-forms-schema-dist
          path: packages/granularity-forms-schema/dist

      - name: Download granularity-datasource dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-datasource-dist
          path: packages/granularity-datasource/dist

      - name: Download granularity-editor dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-editor-dist
          path: packages/granularity-editor/dist

      - name: Build showcase
        run: yarn build:showcase

      - name: Upload showcase
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist
          path: apps/showcase/dist/

  deploy-showcase:
    needs:
      - build-showcase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Группа принадлежит этой джобе, а не всему workflow: конкурентных вызовов
    # не терпит только Pages API. Объявленная на уровне workflow, она сажала в
    # одну очередь все прогоны — веток и всех семи видов тегов, — а в очереди
    # GitHub держит ровно один ожидающий прогон, и следующий вытесняет его.
    # Так из шести тегов одного релиза два оказались `cancelled`.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download showcase dist
        uses: actions/download-artifact@v8
        with:
          name: showcase-dist
          path: showcase-dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: showcase-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Публикация пакета в npm — первичный реестр.
  # Релиз не зависит от showcase, чтобы внешние зависимости витрины
  # (например, @feugene/fint-i18n) не блокировали публикацию @feugene/granularity.
  publish-npm:
    needs:
      - quality-granularity
      - test-granularity
      - build-granularity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/granularity
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/granularity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Публикация в GitHub Packages как зеркало под scope владельца репозитория.
  # Отдельный job, чтобы сбой GPR не откатывал/не блокировал публикацию в npm.
  # Имя пакета в GPR отличается (`@efureev/granularity`), поэтому меняем его
  # на копии через `npm pkg set` (без `sed` по исходному package.json).
  #
  # Предусловия те же, что у публикации в npm, но самой npm-джобы среди них
  # нет. У GPR свой реестр и свой токен, так что зеркалу от неё нужен только
  # порядок «сначала npm» — а платой за него было бы пропущенное зеркало
  # каждый раз, когда `npm publish` возвращает ненулевой код уже после того,
  # как пакет с провенансом загрузился в реестр.
  publish-gpr:
    needs:
      - quality-granularity
      - test-granularity
      - build-granularity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/granularity
        run: |
          # GitHub Packages требует, чтобы scope совпадал с владельцем репозитория.
          # Меняем имя и отключаем provenance/publishConfig локально в рантайме —
          # без мутации исходного package.json в индексе git.
          npm pkg set name='@efureev/granularity'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/granularity
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Сборка build-time пакета @feugene/unplugin-granularity (резолвер для
  # unplugin-vue-components). Артефакт нужен и для валидации (publint),
  # и для последующей публикации по тегу `unplugin-granularity-v*`.
  build-unplugin-granularity:
    needs:
      - quality-granularity
      - build-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Typecheck package
        run: yarn typecheck:unplugin

      - name: Test package
        run: yarn workspace @feugene/unplugin-granularity test:run

      - name: Build package
        run: yarn workspace @feugene/unplugin-granularity build

      - name: Validate package metadata (publint)
        working-directory: packages/unplugin-granularity
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist/

  # Публикация @feugene/unplugin-granularity в npm по тегу вида
  # `unplugin-granularity-v<semver>`. Отдельный тег позволяет релизить
  # build-time пакет независимо от рантайма @feugene/granularity.
  publish-npm-unplugin-granularity:
    needs:
      - build-unplugin-granularity
    if: startsWith(github.ref, 'refs/tags/unplugin-granularity-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/unplugin-granularity
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#unplugin-granularity-v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/unplugin-granularity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория
  # (`@efureev/unplugin-granularity`). Аналогично publish-gpr для granularity.
  publish-gpr-unplugin-granularity:
    needs:
      - build-unplugin-granularity
    if: startsWith(github.ref, 'refs/tags/unplugin-granularity-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/unplugin-granularity
        run: |
          npm pkg set name='@efureev/unplugin-granularity'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/unplugin-granularity
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Сборка опционального companion-пакета @feugene/granularity-chrono
  # (календарь и пикеры даты и времени). Peer-зависит от @feugene/granularity
  # (для vue-tsc нужны его собранные типы) и от @feugene/unplugin-granularity —
  # на его фабрике `createGranularResolver` построен резолвер пакета.
  build-granularity-chrono:
    needs:
      - quality-granularity
      - build-granularity
      - build-unplugin-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
          path: packages/unplugin-granularity/dist

      # Гейты пакета зовут фабрики из собранного `dist` тест-кита — как витрина
      # работает с собранным `dist` ядра. Джоба гоняет скрипты пакета напрямую,
      # поэтому сборка нужна здесь, а не приезжает из корневого скрипта.
      - name: Build test kit
        run: yarn build:test-kit

      - name: Lint
        working-directory: packages/granularity-chrono
        run: yarn lint

      - name: Typecheck
        working-directory: packages/granularity-chrono
        run: yarn typecheck

      # Реестры сверяются с файловой системой до сборки: рассинхрон ломает не
      # сборку, а tree-shaking, subpath-импорт и скан классов — молча.
      - name: Registry drift
        working-directory: packages/granularity-chrono
        run: yarn generate:registry --check

      - name: Locale completeness
        working-directory: packages/granularity-chrono
        run: yarn check:messages

      - name: Test
        working-directory: packages/granularity-chrono
        run: yarn test:run

      - name: Build package
        run: yarn workspace @feugene/granularity-chrono build

      - name: Granular doctor
        working-directory: packages/granularity-chrono
        run: yarn doctor

      - name: Validate package metadata (publint)
        working-directory: packages/granularity-chrono
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist/

  # Публикация @feugene/granularity-chrono в npm по тегу вида
  # `granularity-chrono-v<semver>`. Отдельный тег позволяет релизить компаньон
  # независимо от ядра: у него свой цикл и своя версия.
  publish-npm-granularity-chrono:
    needs:
      - build-granularity-chrono
    if: startsWith(github.ref, 'refs/tags/granularity-chrono-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/granularity-chrono
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#granularity-chrono-v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/granularity-chrono
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория
  # (`@efureev/granularity-chrono`). Аналогично publish-gpr для granularity.
  publish-gpr-granularity-chrono:
    needs:
      - build-granularity-chrono
    if: startsWith(github.ref, 'refs/tags/granularity-chrono-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-chrono-dist
          path: packages/granularity-chrono/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/granularity-chrono
        run: |
          npm pkg set name='@efureev/granularity-chrono'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/granularity-chrono
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-granularity-charts:
    needs:
      - quality-granularity
      - build-granularity
      - build-unplugin-granularity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download granularity dist
        uses: actions/download-artifact@v8
        with:
          name: granularity-dist
          path: packages/granularity/dist

      - name: Download unplugin-granularity dist
        uses: actions/download-artifact@v8
        with:
          name: unplugin-granularity-dist
