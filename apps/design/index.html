<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>granularity — дизайн-система</title>
    <!--
      Порядок слоёв — до скрипта темы: лист сохранённой дополнительной темы, который
      ставит скрипт, объявляет слои granum, а в dev сброс приходит из JS уже после него.
    -->
    <style>@layer reset, granum;</style>
    <!-- Семейства «Сланца»: --gr-font-ui (Inter) и --gr-font-mono (JetBrains Mono). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
